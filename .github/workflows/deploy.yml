# development deploys to staging; main deploys to production.
# Each GitHub Environment holds its own variables and service account. See docs/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      MPP_ADMIN_EMAILS: ${{ vars.MPP_ADMIN_EMAILS }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
      GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      CLIENT_URL: ${{ vars.CLIENT_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Production also runs the scenarios on Google's real rules engine.
      - if: github.ref_name == 'main'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: github.ref_name == 'main'
        run: npm run test:emulator

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: node scripts/deploy.mjs "$DEPLOY_TARGET"
